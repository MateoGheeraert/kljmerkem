<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404 redirect for React Router
      sessionStorage.setItem(
        "redirect",
        location.pathname + location.search + location.hash
      );
      window.location.href = "/";
    </script>
  </head>
  <body>
    <div>Redirecting...</div>
  </body>
</html>
