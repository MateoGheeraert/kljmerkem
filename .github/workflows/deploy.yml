name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['legacy/**', '**.md']
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check for published Sanity changes
        id: content
        run: node scripts/content-state.mjs
      - name: Install
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: npm ci
      - name: Validate and build
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: npm run verify
      - name: Save content fingerprint
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: cp content-state.json dist/content-state.json
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        with:
          path: dist
      - name: Deploy
        id: deployment
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
